name: Windows preview release

on:
  push:
    branches:
      - development/xtransfer-offline
    paths:
      - "windows-client/**"
      - ".github/workflows/windows-release-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Windows x64 EXE
    runs-on: windows-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development/xtransfer-offline

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore windows-client/FastDrop.Windows.csproj

      - name: Build Windows client
        run: dotnet build windows-client/FastDrop.Windows.csproj --configuration Release --no-restore

      - name: Run FD/01 protocol tests
        run: dotnet run --project windows-client/tests/FastDrop.Protocol.Tests.csproj --configuration Release

      - name: Publish self-contained single-file EXE
        shell: pwsh
        run: |
          dotnet publish windows-client/FastDrop.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None --output artifacts/win-x64
          if (-not (Test-Path "artifacts/win-x64/FastDrop.exe")) {
            throw "FastDrop.exe was not produced."
          }
          $file = Get-Item "artifacts/win-x64/FastDrop.exe"
          if ($file.Length -lt 1MB) {
            throw "FastDrop.exe is unexpectedly small ($($file.Length) bytes)."
          }
          Write-Host "Created $($file.FullName) ($($file.Length) bytes)"

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-windows-preview
          target_commitish: ${{ github.sha }}
          name: FastDrop 0.1.0 - Windows Preview
          body: |
            ## FastDrop 0.1.0 — Windows Preview

            Download **FastDrop.exe** below for Windows 10/11 64-bit. This is a self-contained application; the .NET runtime does not need to be installed separately.

            **Important:** This is a preview build. The Windows executable has passed the automated build and protocol tests, but full physical transfer testing with the Android app has not yet been completed.
          prerelease: true
          draft: false
          files: artifacts/win-x64/FastDrop.exe
          fail_on_unmatched_files: true
          overwrite_files: true
